<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Mextrim">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#05080f"/>
      <stop offset="45%" stop-color="#0a1421"/>
      <stop offset="100%" stop-color="#0e2135"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7FD3FF"/>
      <stop offset="55%"  stop-color="#6FD6E0"/>
      <stop offset="100%" stop-color="#7CE7C4"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.22" cy="0.20" r="0.55">
      <stop offset="0%"   stop-color="#7FD3FF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#7FD3FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="0.88" cy="0.88" r="0.55">
      <stop offset="0%"   stop-color="#7CE7C4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7CE7C4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9FE4FF" fill-opacity="0.16"/>
    </pattern>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <clipPath id="frame"><rect x="0" y="0" width="1200" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>

    <!-- topographic contour lines -->
    <g fill="none" stroke="#7FD3FF" stroke-opacity="0.07" stroke-width="1.2">
      <path d="M-20 246 C 180 196, 300 288, 520 240 S 880 168, 1220 214"/>
      <path d="M-20 268 C 180 218, 300 310, 520 262 S 880 190, 1220 236"/>
      <path d="M-20 290 C 180 240, 300 332, 520 284 S 880 212, 1220 258"/>
    </g>

    <rect width="1200" height="300" fill="url(#glowA)"/>
    <rect width="1200" height="300" fill="url(#glowB)"/>

    <!-- soft glow behind the wordmark -->
    <text x="66" y="140"
          font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="62" font-weight="700" letter-spacing="8"
          fill="#7FD3FF" fill-opacity="0.55" filter="url(#soft)">MEXTRIM</text>

    <!-- wordmark -->
    <text x="66" y="140"
          font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="62" font-weight="700" letter-spacing="8"
          fill="url(#accent)">MEXTRIM</text>

    <!-- accent rule -->
    <rect x="68" y="164" width="104" height="3.5" rx="1.75" fill="url(#accent)"/>

    <!-- tagline -->
    <text x="66" y="200"
          font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="18" letter-spacing="1.6" fill="#a9c2d6">
      Rust server admin  ·  Stream chat tooling
    </text>

    <!-- tech chips -->
    <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.4">
      <rect x="880" y="74"  width="140" height="32" rx="16" fill="#7FD3FF" fill-opacity="0.08" stroke="#7FD3FF" stroke-opacity="0.30"/>
      <circle cx="903" cy="90" r="3.5" fill="#7FD3FF"/>
      <text x="916" y="95" fill="#BEE6FF">Carbon</text>

      <rect x="880" y="114" width="140" height="32" rx="16" fill="#7CE7C4" fill-opacity="0.08" stroke="#7CE7C4" stroke-opacity="0.30"/>
      <circle cx="903" cy="130" r="3.5" fill="#7CE7C4"/>
      <text x="916" y="135" fill="#B9F0DC">C# / WPF</text>

      <rect x="880" y="154" width="140" height="32" rx="16" fill="#FFD479" fill-opacity="0.08" stroke="#FFD479" stroke-opacity="0.30"/>
      <circle cx="903" cy="170" r="3.5" fill="#FFD479"/>
      <text x="916" y="175" fill="#FFE4AC">OBS / HTML</text>
    </g>

    <!-- footer -->
    <rect x="66" y="256" width="1068" height="1" fill="#7FD3FF" fill-opacity="0.13"/>
    <text x="66" y="280"
          font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="11.5" letter-spacing="1.8" fill="#5d7387">github.com/Mextrim</text>
    <text x="1134" y="280" text-anchor="end"
          font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="11.5" letter-spacing="1.8" fill="#5d7387">Парабель</text>
  </g>
</svg>